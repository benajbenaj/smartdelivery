query Input {
  deliveryCustomization {
    metafield(namespace: "$app:delivery-customization", key: "function-configuration") {
      jsonValue
    }
  }
  cart {
    cost {
      subtotalAmount {
        amount
      }
    }
    deliveryGroups {
      deliveryAddress {
        countryCode
        zip
      }
      deliveryOptions {
        handle
        title
        code
        cost {
          amount
        }
      }
    }
  }
}
